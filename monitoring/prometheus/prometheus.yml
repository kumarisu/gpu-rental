# Prometheus — GPU Rental Infra
# Relies on cAdvisor's Docker labels: every Coder workspace container carries
# `coder.owner` / `coder.workspace_id` labels, visible here as
# `container_label_coder_owner`, `container_label_coder_workspace_id`, …
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          job: prometheus

  - job_name: cadvisor            # per-container metrics (CPU, RAM, net, disk)
    scrape_interval: 5s
    static_configs:
      - targets:
          - cadvisor:8080
        labels:
          job: cadvisor

  - job_name: node-exporter       # host metrics
    scrape_interval: 5s
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          job: node

  # Optional host-side NVIDIA GPU exporter (see monitoring/gpu/README.md).
  # Uncomment below once the exporter runs on the host:
  # - job_name: gpu-exporter
  #   scrape_interval: 5s
  #   static_configs:
  #     - targets:
  #         - "host.docker.internal:${GPU_EXPORTER_PORT:-9091}"
  #       labels:
  #         job: gpu