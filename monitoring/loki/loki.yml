# Loki (3.6.x) — log store for the GPU Rental platform
# Config schema for Loki 3.x (boltdb-shipper + filesystem storage).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9099

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/data/chunks
      rules_directory: /loki/data/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ingester:
  wal:
    dir: /loki/wal

limits_config:
  retention_period: 672h

compactor:
  working_directory: /loki/data/retention
  retention_enabled: true
  # Required by Loki 3.x when retention is enabled
  delete_request_store: filesystem